<script>
    function main() {
        // Check if study has already been taken
        let evaluationId = localStorage.getItem("evaluation_id");

        if (evaluationId) {
            window.location.href = "http://{{ sever_name }}/end";
            return;
        }

        // Retrieve experiments_dict data
        const experiments_dict = JSON.parse(localStorage.getItem("experiments_dict"));
        const experiments_len = Object.keys(experiments_dict).length 

        // Compute paging
        let npage = document.getElementById("npage");
        npage.innerHTML = npage.innerHTML.replace("I", experiments_len + 2);
        npage.innerHTML = npage.innerHTML.replace("N", experiments_len + 2);

        let ppage = document.getElementById("ppage");
        ppage.style.width = "100%";

        // Retrieve current piece index
        let pieceIndex = parseInt(localStorage.getItem("piece_index"));

        // Define Back button action
        let prevButton = document.getElementById('prevButton');

        prevButton.onclick = function() {
            const gt_idx = parseInt(localStorage.getItem("gt_idx"));

            localStorage.setItem("gt_idx", gt_idx-1);
            localStorage.setItem("piece_index", pieceIndex - 1);

            const current_experiment = experiments_dict[pieceIndex - 1]
            const model_key = current_experiment['model_key']
            const pick_one_key = current_experiment['pick_one_key']
            const content_key = current_experiment['content_key']

            window.location.href = 'http://{{ sever_name }}/evaluate/' + model_key + '/' + pick_one_key + '/' + content_key;
        }

        console.log(JSON.stringify(experiments_dict))
        document.getElementById('experiments_dict').value = JSON.stringify(experiments_dict);

        // Add all the answers to the form
        const questions = JSON.parse('{{ questions | tojson }}');
        const gt_questions = JSON.parse('{{ gt_questions | tojson }}');

        for (let piece = 0; piece < experiments_len; piece++) {
            const current_xp = experiments_dict[piece]

            if(current_xp['is_gt']){
                gt_questions.forEach(question => {
                    const question_id = question._id
                    const questionAnswer = localStorage.getItem(piece + "_q" + question_id);
    
                    console.log(`For ORIGINAL piece ${piece}, question ${question_id}, answer ${questionAnswer}`)
    
                    $('#profile-form').append('<input type="hidden" name="' + piece + "_q" + question_id + '" value="' + questionAnswer + '" />');
                });
            } else{
                questions.forEach(question => {
                    const question_id = question._id
                    const questionAnswer = localStorage.getItem(piece + "_q" + question_id);
    
                    console.log(`For GENERATED piece ${piece}, question ${question_id}, answer ${questionAnswer}`)
    
                    $('#profile-form').append('<input type="hidden" name="' + piece + "_q" + question_id + '" value="' + questionAnswer + '" />');
                });
            }
        }
    }
</script>

<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/css/bootstrap-select.min.css">

    <!-- Local CSS -->
    <link href="{{ url_for('static', filename='css/gt_style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/player.css') }}" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/js/bootstrap-select.min.js"></script>

    <title>{{ title }}</title>
</head>

<body onload="main()">
    <div class="p-1"></div>

    <div class="card bg-white text-dark border rounded">
        <div class="card-header border-0 bg-primary"></div>

        <div class="card-body mx-2">
            <div id="header">
			    <img src="http://{{ sever_name }}/static/imgs/logo.png" class="img-fluid" width="50%" style="min-width: 200px;" alt="Logo">
                <h2 class="font-weight-normal">{{ title }}</h2>
                <sup class="required">* Obrigatório</sup>
            </div>
        </div>
    </div>

    <div class="p-1"></div>

    <form id="evaluate-form" class="needs-validation" action="" onsubmit="return validateForm()" method="GET">
        <div class="card bg-white borderrounded">
            <div class="card-body mx-2">
            <small>
                <label for="">
                <h6 id="piece-name">Ouça a música de fundo <strong> ORIGINAL </strong> deste video game: <sup class="required">*</sup></h6>
                </label>

                <div class="container">
                    <div class="col justify-content-center">
                        <div class="embed-responsive embed-responsive-16by9">
                            <video id="pieceVideo" preload="true" class="embed-responsive-item">
                                <source src="http://{{ sever_name }}/{{ piece }}" type="video/mp4">
                                Your browser does not support the video element.
                            </video>
                        </div>

                        <div id="videoplayer" class="mt-3">
                            <div class="container-fluid px-0">
                                <div class="row no-gutters align-items-center">
                                    <div class="col-1"></div>
                                    <div class="col-2 d-flex justify-content-center">
                                        <div id="pButton" style="cursor: pointer; width: 100%; max-width: 40px;">
                                            <img id="pButtonImg" class="img-fluid" src="http://{{ sever_name }}/static/imgs/play-64x64.png"/>
                                        </div>
                                    </div>
                                    <div class="col-8">
                                        <!--  -->
                                        <div id="timeline" style="height: 8px; border-radius: 5px; position: relative; width: 90%; transform: translateY(-100%);">
                                            <div id="playhead" style="width: 16px; height: 16px; border-radius: 50%; position: absolute; top: 5%;  left: 0;"></div>
                                        </div>
                                    </div>
                                    <div class="col-1"></div>
                                </div>
                            </div>
                        </div>

                            <!-- <audio id="pieceAudio" preload="true">
                            <source src="http://{{ sever_name }}/{{ piece }}" type="audio/mpeg">
                            Your browser does not support the audio element.
                            </audio>

                            <div id="audioplayer">
                            <div class="container">
                                <div class="row">
                                    <div class="col-2">
                                    <div id="pButton">
                                        <img id="pButtonImg" src="http://{{ sever_name }}/static/imgs/play-64x64.png"/>
                                    </div>
                                    </div>
                                    <div class="col">
                                    <div id="timeline">
                                        <div id="playhead"></div>
                                    </div>
                                    </div>
                                </div>
                            </div>
                            </div> -->
                    </div>
                </div>
            </small>
            </div>
        </div>

        {% for question in questions %}
        <div class="p-1"></div>

        <div id="question{{question['_id']}}" class="card bg-white borderrounded" hidden>
            <div class="card-body mx-2">
                <label for="question{{question['_id']}}"><h6> {{question['header']}} <sup class="required">*</sup></h6></label>

                <div id="question{{question['_id']}}-input" class="d-flex flex-wrap flex-md-nowrap gap-3 mt-2 likert" onclick="question_onclick({{question['_id']}})">
                    {% for op_value, op_txt in question['options'] %}
                        <div class="likert-option form-check d-inline-flex align-items-center ml-2 w-auto">
                            <input class="form-check-input me-2" type="radio" name="question{{question['_id']}}" value="{{op_value}}" />
                            <label class="form-check-label text-nowrap mt-1">{{op_txt}}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="p-1"></div>

        <div class="d-flex flex-row align-items-md-center justify-content-between mt-2 mb-2 gap-3">
            <div class="d-flex gap-1">
                <button id="prevButton" type="button" class="btn btn-page bg-white ml-2" onclick="">Anterior</button>
                <button id="nextButton" type="submit" class="btn btn-page bg-white ml-2" >Próximo</button>
            </div>

            <div class="d-flex align-items-center gap-1 w-50 w-md-auto">
                <div id="ppage-back" class="progress bg-secondary flex-grow-1 ml-2" style="height: 10px; min-width: 50px;">
                    <div id="ppage" class="progress-bar" role="progressbar"></div>
                </div>
            </div>

            <div class="d-flex gap-1 ml-2">
                <span id="npage" class="align-items-center">
                    Página I de N
                </span>
            </div>
        </div>
    </form>

    <div class="p-4"></div>
</body>

<!-- Load external libs -->
<script src="{{ url_for('static', filename='js/player.js') }}"></script>

<script>
    function main() {
        // Check if study has already been taken
        const evaluationId = localStorage.getItem("evaluation_id");
        console.log("evaluationId:", evaluationId);

        if (evaluationId) {
            window.location.href = "http://{{ sever_name }}/end";
            return;
        }

        // Retrieve experiments_dict data
        const experiments_dict = JSON.parse(localStorage.getItem("experiments_dict"));
        const experiments_len = Object.keys(experiments_dict).length 

        const questions = JSON.parse('{{ questions | tojson }}');
        console.log("Got the following questions from flask: \n" + questions);

        let pieceIndex = parseInt(localStorage.getItem("piece_index"));
        console.log('pieceIndex ', pieceIndex);

        // Set paging and define piece name
        let npage = document.getElementById("npage");
        npage.innerHTML = npage.innerHTML.replace("I", pieceIndex + 2);
        npage.innerHTML = npage.innerHTML.replace("N", experiments_len + 2);

        let ppage = document.getElementById("ppage");
        ppage.style.width = ((pieceIndex + 2)/(experiments_len + 2) * 100) + "%";

        // let pieceName = document.getElementById("piece-name");
        // pieceName.innerHTML = pieceName.innerHTML.replace("_i_", pieceIndex + 1);

        // Set answers if user has used the prevButton
        questions.forEach(question => {
            const question_id = question._id
            const questionAnswer = localStorage.getItem(pieceIndex + "_q" + question_id);

            if (questionAnswer) {
                console.log(`Prev Button was used: Question ${question_id} had answer ${questionAnswer}`)
                document.getElementById("question"+question_id).hidden = false;
                document.forms["evaluate-form"]["question"+question_id].value = parseInt(questionAnswer);
                pieceEnded = true;
            }
        });

        // Define Back button action
        let prevButton = document.getElementById('prevButton');

        if (pieceIndex == 0) {
            prevButton.onclick = function() {
                saveForm();
                window.location.href = 'http://{{ sever_name }}'
            }
        }
        else {
            prevButton.onclick = function() {
                saveForm();
                localStorage.setItem("piece_index", pieceIndex - 1);
                const current_experiment = experiments_dict[pieceIndex - 1]
                const model_key = current_experiment['model_key']
                const pick_one_key = current_experiment['pick_one_key']
                const content_key = current_experiment['content_key']

                window.location.href = 'http://{{ sever_name }}/evaluate/' + model_key + '/' + pick_one_key + '/' + content_key;
            }
        }

        // Define Next button action
        let evaluateForm = document.getElementById('evaluate-form');

        if (pieceIndex < experiments_len - 1) {
            const current_experiment = experiments_dict[pieceIndex + 1]
            const model_key = current_experiment['model_key']
            const pick_one_key = current_experiment['pick_one_key']
            const content_key = current_experiment['content_key']

            evaluateForm.action = 'http://{{ sever_name }}/evaluate/' + model_key + '/' + pick_one_key + '/' + content_key;
        }
        else {
            evaluateForm.action = 'http://{{ sever_name }}/profile'
        }

        // Video Player
        let pieceVideo = document.getElementById("pieceVideo");

        pieceVideo.onended = function() {
            pieceEnded = true;
            document.getElementById("question0").hidden = false;

            pButtonImg.src = "http://{{ sever_name }}/static/imgs/play-64x64.png";
            playhead.style.backgroundColor = "black";
        };

        // // Audio Player
        // let pieceAudio = document.getElementById("pieceAudio");

        // pieceAudio.onended = function() {
        //   pieceEnded = true;
        //   document.getElementById("question0").hidden = false;

        //   pButtonImg.src = "http://{{ sever_name }}/static/imgs/play-64x64.png";
        //   playhead.style.backgroundColor = "black";
        // };
    }

    function question_onclick(question_id) {
        const current_question = "question"+question_id
        const next_question_id_int = parseInt(question_id)+1
        const next_question_id = "question" + next_question_id_int

        console.log('current_question: ', current_question, "next_question id: " + next_question_id)

        // If there is a next question 
        const next_question_elem = document.getElementById(next_question_id)
        if (next_question_elem){
            console.log('next_question exists and has value:\n', next_question_elem)

            // If current question received a value, show the next one
            if (document.forms["evaluate-form"][current_question].value) {
                document.getElementById(next_question_id).hidden = false;
            }
        }
    }

    function saveForm() {
        const pieceIndex = parseInt(localStorage.getItem("piece_index"));
        const questions = JSON.parse('{{ questions | tojson }}');

        questions.forEach(question => {
            const question_id = question._id
            const questionAnswer = document.forms["evaluate-form"]["question"+question_id].value;
            localStorage.setItem(pieceIndex + "_q" + question_id, questionAnswer);

            console.log(`For pice ${pieceIndex} saved question ${question_id} with value ${questionAnswer}`)
        });
    }

    function validateForm() {
        if (!pieceEnded) {
            alert("Por favor, ouça a música até o final.");
            return false;
        }

        let pieceIndex = parseInt(localStorage.getItem("piece_index"));
        const questions = JSON.parse('{{ questions | tojson }}');

        is_all_answered = true
        questions.forEach(question => {
            const question_id = question._id
            const questionAnswer = document.forms["evaluate-form"]["question"+question_id].value;

            if(!questionAnswer){
                is_all_answered = false
            }
        });

        if(!is_all_answered){
            alert("Por favor, responda a todas as perguntas.");
            return false
        }

        saveForm();

        localStorage.setItem("piece_index", pieceIndex + 1);
        return true;
    }

    //Play and Pause
    function play() {
        // start music
        if (music.paused) {
            music.play();
            // remove play, add pause
            pButtonImg.src = "http://{{ sever_name }}/static/imgs/pause-64x64.png";
        } else { 
            // pause music
            music.pause();
            // remove pause, add play
            pButtonImg.src = "http://{{ sever_name }}/static/imgs/play-64x64.png"
        }
    }

    // play button event listenter
    pButton.addEventListener("click", play);
</script>

</html>
